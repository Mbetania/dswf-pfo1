<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components/navbar.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/animations.css" />
    <link rel="stylesheet" href="css/utilities.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo">MiProyecto</a>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Inicio</a></li>
          <li><a href="galeria.html" class="nav-link">Galería</a></li>
          <li><a href="contacto.html" class="nav-link">Contacto</a></li>
        </ul>
      </div>
    </nav>

    <main class="section">
      <div class="container">
        <div style="max-width: 800px; margin: 0 auto">
          <h1 class="section-title">Contacto</h1>

          <form id="contactForm" class="card" style="padding: var(--space-xl)">
            <div style="margin-bottom: var(--space-md)">
              <label
                for="nombre"
                style="display: block; margin-bottom: var(--space-xs)"
                >Nombre</label
              >
              <input
                type="text"
                id="nombre"
                required
                style="
                  width: 100%;
                  padding: var(--space-xs);
                  border: 1px solid #ddd;
                  border-radius: var(--radius-sm);
                "
              />
            </div>

            <div style="margin-bottom: var(--space-md)">
              <label
                for="email"
                style="display: block; margin-bottom: var(--space-xs)"
                >Email</label
              >
              <input
                type="email"
                id="email"
                required
                style="
                  width: 100%;
                  padding: var(--space-xs);
                  border: 1px solid #ddd;
                  border-radius: var(--radius-sm);
                "
              />
            </div>

            <div style="margin-bottom: var(--space-lg)">
              <label
                for="mensaje"
                style="display: block; margin-bottom: var(--space-xs)"
                >Mensaje</label
              >
              <textarea
                id="mensaje"
                rows="5"
                required
                style="
                  width: 100%;
                  padding: var(--space-xs);
                  border: 1px solid #ddd;
                  border-radius: var(--radius-sm);
                "
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
              Enviar Mensaje
            </button>
          </form>
        </div>
      </div>
    </main>

    <footer class="navbar">
      <div class="container text-center">
        <p>
          &copy; 2023 Formulario de Contacto. Todos los derechos reservados.
        </p>
      </div>
    </footer>

    <script src="js/main.js" defer></script>
  </body>
</html>
